<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CDM Clinic - Colegio de Montalban Clinic Management System">
    <title>CDM Clinic Login</title>

    <link rel="stylesheet" href="login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>
<!-- Redirect if already logged in -->
<script src="supabase-config.js"></script>
<script>
(async function checkIfLoggedIn() {
    const isValid = await checkSession();
    if (isValid) {
        window.location.href = 'dashboard.html';
    }
})();
</script>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left-side">

        <!-- CLOCK -->
        <h1 class="clock" id="clock">00:00:00</h1>

        <!-- INFO -->
        <div class="info-section">
            <div class="location" role="button" tabindex="0" aria-label="View clinic location on map">
                <i class="fas fa-map-marker-alt"></i>
                <span>Kasiglahan Village, Rodriguez, Rizal</span>
            </div>

            <div class="hours">
                <i class="fas fa-clock"></i>
                <span>Mon - Sat | 8:00 AM - 5:00 PM</span>
            </div>
        </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right-side">

        <div class="login-container">

            <!-- LOGO -->
            <div class="logo-section">
                <div class="logo">
                    <img src="img/logo.jpg" alt="CDM Clinic Logo">
                </div>
                <h1 class="title">CDM CLINIC</h1>
            </div>

            <!-- FORM -->
            <form class="login-form" id="loginForm" autocomplete="off">

                <!-- USERNAME -->
                <div class="input-group">
                    <input type="text" id="username" name="username" required placeholder=" " autocomplete="off" autocapitalize="none">
                    <label for="username">Username</label>
                </div>

                <!-- PASSWORD -->
                <div class="input-group">
                    <input type="password" id="password" name="password" required placeholder=" " autocomplete="off">
                    <label for="password">Password</label>
                </div>

                <!-- FORGOT -->
                <a href="#" class="forgot-password" role="button">Forgot Password?</a>

                <!-- BUTTON -->
                <div class="button-group">
                    <button type="submit" id="loginBtn">LOGIN</button>
                </div>

            </form>

            <!-- COPYRIGHT -->
            <div class="copyright">
                CDM CLINIC &copy; 2026
            </div>

        </div>
    </div>

</div>

<!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay" style="display: none;">
    <div class="spinner"></div>
    <p>Logging in...</p>
</div>

<script src="login.js"></script>
</body>
</html>
